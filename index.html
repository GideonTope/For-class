<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Application</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-container">
      <section class="weather-card">
        <h1 class="app-title">Weather Application</h1>

        <div class="search-section">
          <input
            type="text"
            id="city-input-field"
            placeholder="Enter city name"
            aria-label="City Name"
          />
          <button id="search-weather-btn">Search Weather</button>
        </div>

        <div class="weather-display">
          <h2 class="weather-location">No Location Selected</h2>
          <p class="weather-temperature">--°C</p>
          <p class="weather-condition">
            Search for a city to view weather information.
          </p>
        </div>
      </section>
    </main>

    <script>
      const cityInputField = document.getElementById("city-input-field");
      const searchWeatherBtn = document.getElementById("search-weather-btn");

      const locationElement = document.querySelector(".weather-location");
      const temperatureElement = document.querySelector(".weather-temperature");
      const conditionElement = document.querySelector(".weather-condition");

      function renderWeatherToDOM(weatherRecord) {
        locationElement.textContent = weatherRecord.location;
        temperatureElement.textContent = `${weatherRecord.temperature}°C`;
        conditionElement.textContent = weatherRecord.condition;
      }

      async function fetchWeatherData(targetCity) {
        conditionElement.textContent = "Querying satellite data network...";

        try {
          const response = await fetch(
            "https://jsonplaceholder.typicode.com/posts/1",
          );

          if (!response.ok) {
            throw new Error("Failed to retrieve weather information.");
          }

          const data = await response.json();

          const weatherRecord = {
            location: targetCity,
            temperature: data.id * 7 + 18,
            condition: `Weather analysis based on dataset: ${data.title}`,
          };

          renderWeatherToDOM(weatherRecord);
        } catch (error) {
          conditionElement.textContent =
            "Unable to retrieve weather information at this time.";

          console.error("Weather Fetch Error:", error);
        }
      }

      function handleWeatherSearch() {
        const targetCity = cityInputField.value.trim();

        if (!targetCity) {
          conditionElement.textContent = "Please enter a valid city name.";
          return;
        }

        fetchWeatherData(targetCity);
      }

      searchWeatherBtn.addEventListener("click", handleWeatherSearch);
    </script>
  </body>
</html>
